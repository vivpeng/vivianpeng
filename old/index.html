<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vivian peng</title>
    <link rel="stylesheet" href="style.css">

    <link rel="icon" href="images/star-2.png">
</head>
<body>
    <!-- home! -->
     <section id="home">
        <div class="stars"></div>
        <img class="firework" src="images/firework.png" alt="gif of firework"/>

        <div class="title">
            <h1>welcome to vivian's space</h1>
            <a href="#about" class="button">about me</a>
            <a href="#projects" class="button">my projects</a>
        </div>
        
     </section>

     <!-- cloud transition-->
     <img id="clouds" src="images/background-transition.png" alt="transition to next page"/>

    <!-- about me -->
    <section id ="about">

    </section>
    <!-- create a horizontal scroll for my skills -->

    <!-- my projects -->
    <section id ="projects">
        <h2>My Projects</h2>
        <p>
            this part is currently under construction!
        </p>
    </section>

    <!-- JS for the stars in home -->
    <script>
    const numStars = 40;
    const starContainer = document.querySelector('.stars');
    const homeSection = document.getElementById('home');

    for (let i = 0; i < numStars; i++) {
        const star = document.createElement('img');
        
        // random star image
        star.src = 'images/star-' + Math.floor(Math.random() * 4 + 1) + '.png';
        star.classList.add('star');

        // random size for star
        const size = Math.random() * 20 + 10; // 10px to 30px
        star.style.width = `${size}px`;
        star.style.height = `${size}px`;

        // random position within home section
        const x = Math.random() * homeSection.clientWidth;
        const y = Math.random() * homeSection.clientHeight;

        star.style.left = `${x}px`;
        star.style.top = `${y}px`;

        // random twinkle speed & delay
        const duration = 2 + Math.random() * 5;
        const delay = Math.random() * 5;
        star.style.animationDuration = `${duration}s`;
        star.style.animationDelay = `${delay}s`;
        
        starContainer.appendChild(star);
    }
    </script>

</body>
</html>
